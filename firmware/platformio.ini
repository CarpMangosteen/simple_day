[env:sticks3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
upload_port = COM4
monitor_port = COM4
monitor_speed = 115200
board_upload.flash_size = 8MB
board_build.flash_mode = qio
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DCORE_DEBUG_LEVEL=3
lib_deps =
  m5stack/M5Unified@^0.2.2
  bblanchon/ArduinoJson@^6.21.5
